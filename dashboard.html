<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KNK Signage Manager</title><style>body{margin:0;background:#fff5e8;color:#411a11;font:16px system-ui}header{background:#bb261b;color:white;padding:22px}main{max-width:900px;margin:auto;padding:18px}section{background:white;padding:20px;border-radius:14px;margin:15px 0}input,button{padding:10px;margin:5px;border:1px solid #ccc;border-radius:8px}button{background:#ffb122;cursor:pointer}li{padding:12px;border-bottom:1px solid #eee}#msg{font-weight:700}small{color:#765}</style></head><body><header><h1>Krunch N' Krave — Signage Manager</h1><div>Cloud media library</div></header><main><p id="msg">Loading cloud playlist…</p><section><h2>Upload photo or video</h2><form id="upload"><input id="name" placeholder="Product name" maxlength="100" required><input id="price" placeholder="Price (optional)" maxlength="30"><input id="file" type="file" accept="image/*,video/*" required><button>Upload media</button></form><small>Original file bytes are stored in Cloudflare R2. Maximum 150 MB per upload. Artwork appears full-screen without added labels.</small></section><section><h2>Playlist</h2><ul id="list"></ul><a href="/player" target="_blank">Open portrait player</a></section><section><h2>Playback settings</h2><label>Image seconds <input id="seconds" type="number" min="3" max="120" value="6"></label><label>Video volume % <input id="volume" type="number" min="0" max="100" value="80"></label><button id="save">Save settings</button></section></main><script>
let state={slides:[],settings:{seconds:6,volume:80}};const $=id=>document.getElementById(id);const msg=x=>$('msg').textContent=x;
async function api(method,body){const r=await fetch('/api/playlist',{method,body:body instanceof FormData?body:body?JSON.stringify(body):undefined,headers:body instanceof FormData?{}:body?{'content-type':'application/json'}:{},credentials:'same-origin'});const j=await r.json();if(!r.ok)throw Error(j.error||'Request failed '+r.status);return j}
async function load(){try{state=await api('GET');$('seconds').value=state.settings.seconds;$('volume').value=state.settings.volume;render();msg('Cloud playlist ready')}catch(e){msg('Cloud connection error: '+e.message)}}
function render(){const list=$('list');list.replaceChildren();for(const [i,s] of state.slides.entries()){const li=document.createElement('li');const title=document.createElement('strong');title.textContent=s.name+(s.price?' — '+s.price:'')+' ('+(s.mediaType.startsWith('video/')?'Video':'Image')+')';li.append(title);for(const [label,action] of [[s.enabled?'Disable':'Enable','enabled'],[s.featured?'Unfeature':'Feature','featured'],['Up','up'],['Down','down'],['Delete','delete']]){const b=document.createElement('button');b.textContent=label;b.onclick=async()=>{try{if(action==='up'||action==='down'){const ids=state.slides.map(x=>x.id),j=i+(action==='up'?-1:1);if(j<0||j>=ids.length)return;[ids[i],ids[j]]=[ids[j],ids[i]];await api('POST',{action:'reorder',ids})}else{if(action==='delete'&&!confirm('Permanently delete this slide?'))return;await api('POST',{action:action==='delete'?'delete':'toggle',id:s.id,field:action})}await load()}catch(e){msg(e.message)}};li.append(b)}list.append(li)}}
$('upload').onsubmit=async e=>{e.preventDefault();const f=new FormData();f.set('name',$('name').value);f.set('price',$('price').value);f.set('file',$('file').files[0]);msg('Uploading original file…');try{await api('PUT',f);$('upload').reset();await load()}catch(e){msg('Upload failed: '+e.message)}};
$('save').onclick=async()=>{try{await api('POST',{action:'settings',seconds:+$('seconds').value,volume:+$('volume').value});await load()}catch(e){msg(e.message)}};load();
</script></body></html>
