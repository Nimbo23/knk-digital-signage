name: Build KNK Windows Player
on:
  workflow_dispatch:
  push:
    paths:
      - 'windows-player/**'
      - '.github/workflows/windows-player.yml'
jobs:
  windows-installer:
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: windows-player
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Windows setup
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: KNK-Signage-Player-Windows-Setup
          path: windows-player/dist/*.exe
          if-no-files-found: error
          retention-days: 30
