<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KNK Portrait Player</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:system-ui}
#screen{position:relative;width:100vw;height:100dvh;background:#000;overflow:hidden}
.media{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
#status{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:#fff;background:linear-gradient(145deg,#f8a71d,#d52b1e)}
#start{position:absolute;left:50%;bottom:8%;transform:translateX(-50%);padding:14px 22px;border:0;border-radius:12px;background:#ffb421;color:#43140a;font-size:18px;font-weight:800;cursor:pointer;z-index:3}
#status[hidden],.media[hidden],#start[hidden]{display:none}
</style></head><body><main id="screen"><div id="status">Add media in KNK Signage Manager to begin.</div><img id="image" class="media" hidden alt="KNK product artwork"><video id="video" class="media" hidden playsinline preload="auto"></video><button id="start" hidden>Start signage with sound</button></main>
<script>
const KEY='knk_signage_demo_v1';
const $=id=>document.getElementById(id);
let index=0,timer=null,started=false,token=0;
let cloud={slides:[],settings:{seconds:6,volume:80}};async function refresh(){try{const r=await fetch('/api/playlist',{cache:'no-store'});if(!r.ok)throw Error('Playlist '+r.status);cloud=await r.json()}catch(e){$('status').textContent='Cannot load cloud playlist: '+e.message;$('status').hidden=false}}
function mediaUrl(s){return s.url||s.image||s.video||''}
function isVideo(s){return s.type==='video'||s.mediaType?.startsWith('video/')||/\.(mp4|webm|mov)(\?|$)/i.test(mediaUrl(s))}
function stop(){clearTimeout(timer);$('video').pause();$('video').removeAttribute('src');$('video').load();$('video').hidden=true;$('image').hidden=true;$('start').hidden=true}
async function next(){stop();await refresh();const t=++token;const data={...cloud.settings,slides:cloud.slides};const slides=(data.slides||[]).filter(s=>s.enabled!==false&&mediaUrl(s));if(!slides.length){$('status').hidden=false;$('status').textContent='Add media in KNK Signage Manager to begin.';timer=setTimeout(next,5000);return}
const s=slides[index++%slides.length],url=mediaUrl(s);$('status').hidden=true;
if(isVideo(s)){const v=$('video');v.hidden=false;v.src=url;v.muted=false;v.volume=Math.max(0,Math.min(1,Number(data.volume??80)/100));v.onended=()=>{if(t===token)next()};v.onerror=()=>{if(t===token)next()};v.play().then(()=>{$('start').hidden=true}).catch(()=>{if(t!==token)return;$('start').hidden=false;$('start').onclick=()=>{started=true;v.play().then(()=>$('start').hidden=true).catch(()=>{$('start').textContent='Tap to enable sound'})}})}
else{$('image').src=url;$('image').hidden=false;timer=setTimeout(()=>{if(t===token)next()},Math.max(3,Math.min(120,Number(data.seconds)||6))*1000)}
}
window.addEventListener('storage',e=>{if(e.key===KEY){index=0;next()}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&$('video').hidden===false&&$('video').paused){$('video').play().catch(()=>{$('start').hidden=false})}});
next();
</script></body></html>
