<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KNK Portrait Player — Prototype</title><style>*{box-sizing:border-box}body{margin:0;background:#111;display:grid;place-items:center;min-height:100vh;font-family:system-ui}#screen{height:100vh;max-width:100vw;aspect-ratio:11.75/18.75;background:linear-gradient(155deg,#ffce48,#f47c16 60%,#c52b19);display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;color:#641a12;padding:5%;overflow:hidden}h1{font-size:clamp(18px,4vh,40px)}#name{font-size:clamp(25px,5vh,58px);font-weight:900}#price{font-size:clamp(34px,7vh,80px);font-weight:900;color:white;text-shadow:2px 3px #9a241b}img{width:100%;height:54%;object-fit:contain}#placeholder{height:54%;display:grid;place-items:center;font-size:25px}</style></head><body><div id="screen"><h1>KRUNCH N' KRAVE</h1><div id="placeholder">Product slideshow preview</div><img id="photo" hidden alt=""><div><div id="name"></div><div id="price"></div></div></div><script>
let index=0;function tick(){let d;try{d=JSON.parse(localStorage.getItem('knk_signage_demo_v1'))||{}}catch{d={}}const slides=(d.slides||[]).filter(s=>s.enabled);if(!slides.length){document.getElementById('name').textContent='Add products in the dashboard';return}const s=slides[index++%slides.length];document.getElementById('name').textContent=s.name;document.getElementById('price').textContent=s.price;const photo=document.getElementById('photo'),p=document.getElementById('placeholder');photo.hidden=!s.image;p.hidden=!!s.image;if(s.image)photo.src=s.image;setTimeout(tick,Math.max(3,Math.min(30,+d.seconds||6))*1000)}tick();
</script></body></html>
